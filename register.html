<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/register.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🔧 LeaveEasy — สมัครสมาชิก</h1>
    <p class="subtitle">สมัครแล้วเข้าใช้งานได้ทันทีในฐานะผู้ขอลา (employee)</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="เช่น สมชาย ใจดี">

        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="you@example.com">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</body>
</html>
