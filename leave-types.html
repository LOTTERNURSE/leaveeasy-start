<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการประเภทการลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/leave-types.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>จัดการประเภทการลา</h1>
    <p class="subtitle">ประเภทที่เพิ่มที่นี่ จะไปโผล่ในรายการเลื่อนลงของหน้ายื่นใบลาใหม่</p>

    <div id="เนื้อหาประเภทการลา">
      <div class="card">
        <label for="ชื่อประเภทใหม่">เพิ่มประเภทการลาใหม่</label>
        <input type="text" id="ชื่อประเภทใหม่" placeholder="เช่น ลาคลอด">
        <div id="เตือนประเภท" class="alert alert-error hidden"></div>
        <div class="btn-row">
          <button type="button" id="ปุ่มเพิ่ม">เพิ่มประเภทการลา</button>
        </div>
      </div>

      <div class="card">
        <h2>ประเภทการลาที่มีอยู่</h2>
        <div id="ตารางประเภท"></div>
      </div>
    </div>

    <div id="ไม่มีสิทธิ์เข้าถึง" class="card hidden">
      <p>หน้านี้สำหรับฝ่ายบุคคลเท่านั้น</p>
    </div>
  </div>
</body>
</html>
